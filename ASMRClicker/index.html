<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5e6ef">
  <title>ASMR Кликер</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="logo">ASMR<span>CLICK</span></div>
      <div class="top-actions">
        <div class="coins-pill" id="coinsPill">
          <img class="ico-img" src="assets/icons/coin.png" alt="">
          <span id="coins">0</span>
        </div>
        <button class="icon-btn text-btn" id="decorEditBtn" title="Расставить комнату"><span
            class="edit-label">Комната</span></button>
        <button class="icon-btn" id="settingsBtn" title="Настройки"><img src="assets/icons/settings.png"
            alt=""></button>
      </div>
    </header>

    <main class="main">
      <p class="tagline">кликай · слушай · расслабляйся</p>
      <h1 class="obj-title" id="objectName">Мягкая клавиша</h1>

      <div class="stage">
        <div class="stage-glow" id="stageGlow"></div>
        <div class="decor-layer decor-behind" id="decorBehind"></div>
        <button class="clicker skin-key" id="clickButton" type="button" aria-label="Кликни">
          <span class="clicker-face">
            <span class="clicker-label" id="clickSymbol">ПРОБЕЛ</span>
            <span class="clicker-shine"></span>
          </span>
        </button>
        <div class="decor-layer decor-front" id="decorFront"></div>
        <div class="float-layer" id="floatLayer"></div>
      </div>

      <div class="combo-line" id="comboLine"></div>

      <div class="stats-row">
        <div class="stat">
          <span class="stat-l">за клик</span>
          <span class="stat-v">+<span id="clickPower">1</span></span>
        </div>
        <div class="stat">
          <span class="stat-l">жетоны</span>
          <span class="stat-v"><span id="tokens">0</span> <img class="ico-inline" src="assets/icons/token.png"
              alt=""></span>
        </div>
        <div class="stat">
          <span class="stat-l">всего</span>
          <span class="stat-v" id="totalClicks">0</span>
        </div>
      </div>

      <div class="ad-row">
        <button class="ad-btn" id="adX2" type="button">
          <span class="ad-ico">▶</span>
          <span class="ad-txt"><b>×5 монеты</b><small>5 мин</small></span>
        </button>
        <button class="ad-btn" id="adBoost" type="button">
          <span class="ad-ico">▶</span>
          <span class="ad-txt"><b>Буст комбо</b><small>3 мин</small></span>
        </button>
      </div>
    </main>

    <nav class="botnav" id="botnav">
      <button class="nav-item active" data-panel="upgrades">
        <span class="nav-ico"><img src="assets/icons/upgrade.png" alt=""></span>
        <span>Улучш.</span>
      </button>
      <button class="nav-item" data-panel="objects">
        <span class="nav-ico"><img src="assets/icons/objects.png" alt=""></span>
        <span>Предметы</span>
      </button>
      <button class="nav-item" data-panel="depalka">
        <span class="nav-ico"><img src="assets/icons/wheel.png" alt=""></span>
        <span>Колесо</span>
      </button>
      <button class="nav-item" data-panel="themes">
        <span class="nav-ico"><img src="assets/icons/theme.png" alt=""></span>
        <span>Темы</span>
      </button>
      <button class="nav-item" data-panel="sounds">
        <span class="nav-ico"><img src="assets/icons/sound.png" alt=""></span>
        <span>Звуки</span>
      </button>
    </nav>
  </div>

  <div class="sheet hidden" id="shopSheet">
    <div class="sheet-backdrop" data-close="shop"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle">Улучшения</h2>
        <button class="icon-btn sm" data-close="shop">✕</button>
      </div>
      <div class="sheet-body" id="sheetBody">

      </div>
    </div>
  </div>

  <div class="sheet hidden" id="settingsSheet">
    <div class="sheet-backdrop" data-close="settings"></div>
    <div class="sheet-panel settings-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2><img class="ico-inline" src="assets/icons/settings.png" alt=""
            style="width:22px;height:22px;vertical-align:middle;margin-right:6px">Настройки</h2>
        <button class="icon-btn sm" data-close="settings">✕</button>
      </div>
      <div class="sheet-body">
        <div class="set-block">
          <div class="set-title"><img class="ico-inline" src="assets/icons/sound.png" alt=""> Звук</div>
          <div class="set-row">
            <span>Громкость</span>
            <input type="range" id="volRange" min="0" max="100" value="75">
            <span id="volLabel" class="set-val">75%</span>
          </div>
          <div class="set-row">
            <span>Звуки кликов</span>
            <button class="switch on" id="swSound" type="button"></button>
          </div>
        </div>
        <div class="set-block">
          <div class="set-title"><img class="ico-inline" src="assets/icons/fx.png" alt=""> Эффекты</div>
          <div class="set-row">
            <span>Вибрация</span>
            <button class="switch on" id="swVib" type="button"></button>
          </div>
          <div class="set-row">
            <span>Плавающие цифры</span>
            <button class="switch on" id="swFloat" type="button"></button>
          </div>
          <div class="set-row">
            <span>Частицы</span>
            <button class="switch on" id="swPart" type="button"></button>
          </div>
        </div>
        <div class="set-block">
          <div class="set-title"><img class="ico-inline" src="assets/icons/data.png" alt=""> Данные</div>
          <button class="danger" id="resetBtn" type="button">Сбросить прогресс</button>
        </div>
        <p class="about">ASMR Кликер · сделано с душой</p>
      </div>
    </div>
  </div>

  <div class="room-editor hidden" id="roomEditor">
    <div class="room-editor-bottom">
      <div class="decor-toolbar" id="decorToolbar">
        <div class="decor-acts">
          <button type="button" data-decor-act="rotL" title="Повернуть">↺</button>
          <button type="button" data-decor-act="rotR" title="Повернуть">↻</button>
          <button type="button" data-decor-act="smaller" title="Меньше">−</button>
          <button type="button" data-decor-act="bigger" title="Больше">+</button>
          <button type="button" data-decor-act="back" title="Назад">⬇</button>
          <button type="button" data-decor-act="front" title="Вперёд">⬆</button>
          <button type="button" data-decor-act="remove" title="Убрать">✕</button>
        </div>
      </div>
      <div class="editor-owned" id="editorOwnedList"></div>
      <button type="button" class="room-save-btn" id="decorSaveBtn">Сохранить</button>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <button class="gift-btn hidden" id="giftBtn" type="button" title="Подарок!"><img src="assets/icons/gift.png"
      alt=""></button>
  <div class="particles" id="particles"></div>
  <div class="fx-layer" id="fxLayer"></div>

  <script src="game.js"></script>
</body>

</html>
